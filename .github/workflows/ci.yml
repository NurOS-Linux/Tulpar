name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format python3

      - name: Run checks
        run: python3 scripts/checkpatch.py

  build:
    name: Build and test (${{ matrix.buildtype }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        buildtype: [debug, release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config gettext python3-pip \
            libcurl4-openssl-dev \
            libarchive-dev liblmdb-dev libseccomp-dev libsodium-dev
          sudo pip3 install --break-system-packages -U 'meson>=1.4.0'

      - name: Build
        run: |
          meson setup build --buildtype=${{ matrix.buildtype }}
          meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

  sanitize:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config gettext clang python3-pip \
            libcurl4-openssl-dev \
            libarchive-dev liblmdb-dev libseccomp-dev libsodium-dev
          sudo pip3 install --break-system-packages -U 'meson>=1.4.0'

      - name: Build with sanitizers
        run: |
          CC=clang meson setup build-san \
            --buildtype=debug \
            -Db_sanitize=address,undefined \
            -Db_lundef=false
          meson compile -C build-san

      - name: Test
        run: meson test -C build-san --print-errorlogs
