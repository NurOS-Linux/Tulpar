name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Install basic tools
        run: |
          apt-get update && apt-get install -y git sudo curl ca-certificates

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format python3

      - name: Run checks
        run: python3 scripts/checkpatch.py

  build:
    name: Build and test
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Install basic tools
        run: |
          apt-get update && apt-get install -y git sudo curl ca-certificates

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config gettext \
            libcurl4-openssl-dev \
            libarchive-dev liblmdb-dev libseccomp-dev libsodium-dev

      - name: Build
        run: |
          meson setup build --buildtype=debug
          meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs
